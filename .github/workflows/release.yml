name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(bun -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Check project
        run: bun run check

  package:
    name: Package ${{ matrix.platform }}
    needs: quality
    # macOS binaries are signed with codesign, which exists only on macOS.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: bun-darwin-arm64
            os: macos-latest
          - platform: darwin-x64
            target: bun-darwin-x64
            os: macos-latest
          - platform: linux-arm64
            target: bun-linux-arm64
            os: ubuntu-latest
          - platform: linux-x64
            target: bun-linux-x64-baseline
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web application
        run: bun run build:web
      - name: Compile executable
        run: ./scripts/build-cli.sh "dist/decisionator-${{ matrix.platform }}" "${{ matrix.target }}"
      - name: Package release archive
        run: ./scripts/package-release.sh "${{ matrix.platform }}" "dist/decisionator-${{ matrix.platform }}" release
      - name: Verify the packaged macOS signature
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          mkdir -p verify
          tar -xzf "release/decisionator-${{ matrix.platform }}.tar.gz" -C verify
          codesign --verify --strict --verbose=2 verify/decisionator
          if [ "${{ matrix.platform }}" = "darwin-$(uname -m)" ]; then verify/decisionator --version; fi
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: decisionator-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
